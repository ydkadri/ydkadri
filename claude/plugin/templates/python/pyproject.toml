[project]
name = "project-name"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = ["attrs>=23.0", "structlog>=24.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-mock>=3", "mypy>=1.10", "ruff>=0.6", "import-linter>=2.0", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "D", "BLE", "T20", "TID", "SIM", "S", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use structlog."
"dataclasses".msg = "Use attrs."
"unittest.mock".msg = "Use pytest-mock."
"typing.Optional".msg = "Use X | None."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]

[tool.mypy]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "def __repr__", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.importlinter]
root_package = "project_name"
